<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Caja · Estación Alanna Café</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#FAF6ED;
    --crema2:#F5F0DC;
    --cafe:#3D2A1F;
    --cafe-claro:#6B4A2A;
    --dorado:#C0955A;
    --salvia:#A3AD82;
    --miel:#EF9F27;
    --rojo:#B85C4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cafe);
    font-family:'Lato',sans-serif;
    color:var(--cafe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0;
  }
  .app{
    width:100%;
    max-width:460px;
    background:var(--crema);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.3);
  }
  header{
    background:var(--cafe);
    color:var(--crema);
    padding:18px 20px 16px;
    text-align:center;
    flex-shrink:0;
  }
  header .title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.3px;
  }
  header .subtitle{
    font-size:11px;
    letter-spacing:2px;
    color:var(--dorado);
    text-transform:uppercase;
    margin-top:2px;
  }

  .total-bar{
    background:var(--miel);
    padding:16px 20px;
    text-align:center;
    flex-shrink:0;
    position:sticky;
    top:0;
    z-index:5;
  }
  .total-bar .label{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#5A3800;
    font-weight:700;
  }
  .total-bar .amount{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:40px;
    color:var(--cafe);
    line-height:1.2;
    font-variant-numeric:tabular-nums;
  }
  .total-bar .count{
    font-size:12px;
    color:#5A3800;
    margin-top:2px;
  }

  .section{
    padding:16px 20px 0;
  }
  .section-label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--salvia);
    font-weight:700;
    margin-bottom:8px;
  }

  .combos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .combo-btn{
    background:var(--cafe);
    color:var(--crema);
    border:none;
    border-radius:10px;
    padding:10px 6px;
    text-align:center;
    cursor:pointer;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  .combo-btn:active{transform:scale(0.96);background:var(--cafe-claro);}
  .combo-btn .cname{
    font-size:12px;
    font-weight:700;
    display:block;
  }
  .combo-btn .cprice{
    font-size:14px;
    font-weight:900;
    color:var(--miel);
    display:block;
    margin-top:2px;
  }

  .entry-form{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .entry-form input{
    font-family:'Lato',sans-serif;
    border:2px solid var(--dorado);
    background:#fff;
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    color:var(--cafe);
    outline:none;
  }
  .entry-form input::placeholder{color:#B9A98C;}
  .entry-form input:focus{border-color:var(--miel);}
  #desc{flex:1.4; min-width:0;}
  #price{flex:1; min-width:0;}
  .add-btn{
    width:100%;
    margin-top:8px;
    background:var(--cafe);
    color:var(--crema);
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.08s ease;
  }
  .add-btn:active{transform:scale(0.98);background:var(--cafe-claro);}

  .ticket{
    flex:1;
    padding:16px 20px 8px;
    overflow-y:auto;
  }
  .empty-msg{
    text-align:center;
    color:#B9A98C;
    font-style:italic;
    font-size:14px;
    padding:30px 10px;
    border-top:2px dashed var(--dorado);
  }
  .ticket ul{
    list-style:none;
    margin:0;
    padding:0;
    border-top:2px dashed var(--dorado);
  }
  .ticket li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid #E9E0CB;
    animation:slideIn 0.18s ease;
  }
  @keyframes slideIn{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .item-desc{
    font-size:14.5px;
    color:var(--cafe);
    flex:1;
    min-width:0;
    overflow-wrap:break-word;
  }
  .item-desc .no-desc{color:#B9A98C; font-style:italic;}
  .item-price{
    font-weight:700;
    color:var(--dorado);
    font-size:15px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .remove-btn{
    background:none;
    border:none;
    color:var(--rojo);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    padding:4px 6px;
    flex-shrink:0;
  }

  footer{
    padding:14px 20px 22px;
    flex-shrink:0;
  }
  .clear-btn{
    width:100%;
    background:transparent;
    border:2px solid var(--rojo);
    color:var(--rojo);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .clear-btn:active{background:rgba(184,92,74,0.08);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">☕ Estación Alanna Café</div>
    <div class="subtitle">Caja</div>
  </header>

  <div class="total-bar">
    <div class="label">Total a cobrar</div>
    <div class="amount" id="totalAmount">₲ 0</div>
    <div class="count" id="itemCount">0 ítems</div>
  </div>

  <div class="section">
    <div class="section-label">Combos rápidos</div>
    <div class="combos">
      <button class="combo-btn" data-desc="Combo 1" data-price="8000">
        <span class="cname">Combo 1</span><span class="cprice">₲ 8.000</span>
      </button>
      <button class="combo-btn" data-desc="Combo 2" data-price="10000">
        <span class="cname">Combo 2</span><span class="cprice">₲ 10.000</span>
      </button>
      <button class="combo-btn" data-desc="Combo 3" data-price="15000">
        <span class="cname">Combo 3</span><span class="cprice">₲ 15.000</span>
      </button>
    </div>

    <div class="section-label" style="margin-top:16px;">Agregar manualmente</div>
    <form class="entry-form" id="entryForm">
      <input id="desc" type="text" placeholder="Descripción (opcional)" autocomplete="off">
      <input id="price" type="number" inputmode="numeric" placeholder="Precio" min="0" step="1" autocomplete="off">
    </form>
    <button class="add-btn" id="addBtn" type="button">+ Agregar a la cuenta</button>
  </div>

  <div class="ticket">
    <div class="empty-msg" id="emptyMsg">Todavía no agregaste nada.<br>Tocá un combo o cargá un precio.</div>
    <ul id="list"></ul>
  </div>

  <footer>
    <button class="clear-btn" id="clearBtn">Nueva cuenta (vaciar todo)</button>
  </footer>
</div>

<script>
  let items = [];

  const listEl = document.getElementById('list');
  const emptyMsg = document.getElementById('emptyMsg');
  const totalAmountEl = document.getElementById('totalAmount');
  const itemCountEl = document.getElementById('itemCount');
  const descInput = document.getElementById('desc');
  const priceInput = document.getElementById('price');

  function formatGs(n){
    return '₲ ' + Math.round(n).toLocaleString('es-PY');
  }

  function render(){
    listEl.innerHTML = '';
    if(items.length === 0){
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      items.forEach((it, idx) => {
        const li = document.createElement('li');
        const descHtml = it.desc
          ? it.desc
          : '<span class="no-desc">Sin descripción</span>';
        li.innerHTML = `
          <span class="item-desc">${descHtml}</span>
          <span class="item-price">${formatGs(it.price)}</span>
          <button class="remove-btn" aria-label="Quitar" data-idx="${idx}">×</button>
        `;
        listEl.appendChild(li);
      });
    }
    const total = items.reduce((sum, it) => sum + it.price, 0);
    totalAmountEl.textContent = formatGs(total);
    itemCountEl.textContent = items.length === 1 ? '1 ítem' : items.length + ' ítems';
  }

  function addItem(desc, price){
    if(!price || price <= 0) return;
    items.unshift({ desc: (desc || '').trim(), price: price });
    render();
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    const price = parseFloat(priceInput.value);
    addItem(descInput.value, price);
    descInput.value = '';
    priceInput.value = '';
    descInput.focus();
  });

  priceInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      document.getElementById('addBtn').click();
    }
  });
  descInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      priceInput.focus();
    }
  });

  document.querySelectorAll('.combo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      addItem(btn.dataset.desc, parseFloat(btn.dataset.price));
    });
  });

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.remove-btn');
    if(!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    items.splice(idx, 1);
    render();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if(items.length === 0) return;
    if(confirm('¿Vaciar la cuenta actual y empezar una nueva?')){
      items = [];
      render();
    }
  });

  render();
</script>
</body>
</html>
